<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li class="brand"><img src="./logo.png" alt="Spotify logo">SPOTIFY</li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>

    <div class="container">
        <div class="songList">
            <h1>Best of Vanshika- No Copyright</h1>
            <div class="songItemContainer">
                <div class="songItem">
                    <img alt="1">
                    <span class="songName">BABA JI</span>
                    <span class="songlistplay"><span class="timestamp">05:34 <i id="0" class="songItemPlay fa-solid fa-circle-play"></i> </span></span>
                </div>
                <div class="songItem">
                    <img alt="2">
                    <span class="songName">KALANK</span>
                    <span class="songlistplay"><span class="timestamp">05:34 <i id="1" class="songItemPlay fa-solid fa-circle-play"></i> </span></span>
                </div>
                <div class="songItem">
                    <img alt="3">
                    <span class="songName">PEELINGS</span>
                    <span class="songlistplay"><span class="timestamp">05:34 <i id="2" class="songItemPlay fa-solid fa-circle-play"></i> </span></span>
                </div>
                <div class="songItem">
                    <img alt="4">
                    <span class="songName">PHIR LE AAYA</span>
                    <span class="songlistplay"><span class="timestamp">05:34 <i id="3" class="songItemPlay fa-solid fa-circle-play"></i> </span></span>
                </div>
                <div class="songItem">
                    <img alt="5">
                    <span class="songName">SENOOR</span>
                    <span class="songlistplay"><span class="timestamp">05:34 <i id="4" class="songItemPlay fa-solid fa-circle-play"></i> </span></span>
                </div>
                <div class="songItem">
                    <img alt="6">
                    <span class="songName">SOCH</span>
                    <span class="songlistplay"><span class="timestamp">05:34 <i id="5" class="songItemPlay fa-solid fa-circle-play"></i> </span></span>
                </div>
            </div>
        </div>
        <div class="songBanner"></div>
    </div>
    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
        <div class="icons">
            <!-- fontawesome icons -->
            <i class="fa-solid fa-3x fa-step-backward" id="previous"></i>
            <i class="fa-solid fa-3x fa-circle-play" id="masterPlay"></i>
            <i class="fa-solid fa-3x fa-step-forward" id="next"></i>
        </div>
        <div class="songInfo">
            <img src="./playing.gif" width="42px" alt="" id="gif"><span id="masterSongName">BABA JI</span>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://kit.fontawesome.com/764c28b2c6.js" crossorigin="anonymous"></script>
</body>
</html>
